<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Teams Sign-in</title>
    <link rel="stylesheet" href="source/oauth.css">
</head>
<body>
    <div id="app">
        <div class="brand"><img src="images/header-icon.png" alt="Teams"></div>
        <h1>Microsoft Teams</h1>
        <p id="status">Preparing sign-in&hellip;</p>
        <button id="signin" class="hidden">Sign in</button>
        <div id="devicecode" class="hidden">
            <p>On another device go to <b>microsoft.com/devicelogin</b> and enter:</p>
            <p class="code" id="usercode">&mdash;</p>
        </div>
        <button id="cancel" class="secondary">Cancel</button>
    </div>
    <script src="source/teamsOAuth.js"></script>
</body>
</html>
