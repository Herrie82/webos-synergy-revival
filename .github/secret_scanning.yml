# GitHub secret-scanning configuration.
#
# Exclude VENDORED third-party plugin source trees from secret-scanning alerts. These
# are upstream open-source snapshots (libpurple plugins, TDLib, etc.) that embed their
# OWN app credentials and test fixtures, which GitHub flags:
#   - messaging/googlechat/plugin/purple-googlechat/  ships the plugin's shared Google
#     API key / OAuth client (public upstream; not ours to rotate).
#   - messaging/telegram/plugin/tdlib-src/tdutils/test/crypto.cpp  ships a throwaway RSA
#     test keypair (a false positive - a public test key, not a real credential).
# Our OWN code (the cloud connectors, services, apps) is NOT excluded, so a real secret
# we introduce still gets flagged.
#
# NOTE: paths-ignore only suppresses FUTURE alerts; existing alerts must still be
# dismissed manually in the Security tab, and this config takes effect from the
# repository's DEFAULT branch.
paths-ignore:
  - "messaging/**/plugin/**"
