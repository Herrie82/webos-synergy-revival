# GitHub secret-scanning configuration.
#
# Exclude VENDORED third-party source trees from secret-scanning alerts. These are
# upstream open-source snapshots that ship TEST fixtures - e.g. TDLib's
# tdutils/test/crypto.cpp contains a throwaway RSA test keypair that GitHub matches
# as a "Google Cloud private key" (a false positive: it is a public test key, not a
# real credential). Our own connector code is NOT excluded.
#
# NOTE: paths-ignore only suppresses FUTURE alerts; any existing alert must still be
# dismissed manually (as "used in tests" / false positive) in the Security tab.
paths-ignore:
  - "messaging/**/tdlib-src/**"
